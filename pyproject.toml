[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memora"
version = "0.2.0"
description = "Local-first persistent memory infrastructure for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MEMORA Contributors"}
]
keywords = [
    "memory",
    "rag",
    "obsidian",
    "mcp",
    "embeddings",
    "vector-search",
    "ai-agents"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "chromadb>=0.5.0",
    "mcp>=2.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pathspec>=0.12.0",
    "python-frontmatter>=1.0.0",
]

[project.optional-dependencies]
http = [
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]
all = ["memora[http,dev]"]

[project.scripts]
memora = "memora.cli:app"
memora-server = "memora.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Xat01/MEMORA"
Repository = "https://github.com/Xat01/MEMORA"
Issues = "https://github.com/Xat01/MEMORA/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["memora*"]

[tool.setuptools.package-data]
"memora" = ["py.typed"]
"skills" = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
