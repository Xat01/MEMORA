[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memora"
version = "0.1.0"
description = "Local-first persistent memory infrastructure for AI agents"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "MEMORA Contributors"}
]
keywords = [
    "memory",
    "rag",
    "obsidian",
    "mcp",
    "embeddings",
    "vector-search",
    "ai-agents"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "chromadb>=0.5.0",
    "ollama>=0.3.0",
    "mcp>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "watchdog>=4.0.0",
    "pathspec>=0.12.0",
    "python-frontmatter>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
]

[project.scripts]
memora = "memora.cli:app"
memora-index = "memora.ingestion.__main__:main"
memora-memory = "memora.memory.__main__:main"
memora-server = "memora.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "T20", # flake8-print
]

[tool.black]
line-length = 100
target-version = ["py310"]